name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/sync_core.py --check
      - run: python tools/validate_skills.py
      - run: python -W ignore -m unittest discover -s tests
      - run: python tools/build_packages.py
      - name: Publish GitHub release with .skill packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.skill
            dist/tradingkit-skills-all.zip
            dist/SHA256SUMS
          generate_release_notes: true
